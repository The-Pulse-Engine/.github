name: Check links

on:
  push:
    branches: [main]
    paths: ["**.md", ".github/workflows/check-links.yml"]
  pull_request:
    paths: ["**.md", ".github/workflows/check-links.yml"]
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Every link in the READMEs still works
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # LinkedIn and Ko-fi refuse automated requests (HTTP 999 and a bot check),
      # so a working link there would still fail the check.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --exclude "linkedin\.com"
            --exclude "ko-fi\.com"
            "**/*.md"
          fail: true
